# scripts/mediamtx.yml
# High-Stability Smooth 60 FPS Video Engine for sisyfuz.com

rtsp: no

# RTMP Ingest from OBS Studio (localhost:1935)
rtmp: yes
rtmpAddress: :1935

# High-Performance HLS (1s segments for zero buffer starvation)
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentCount: 5
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins:
  - '*'

# Stream Paths
paths:
  live:
    source: publisher
  all_others:
