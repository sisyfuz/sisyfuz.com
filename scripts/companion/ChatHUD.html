<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISYFUZ // HOST CHAT HUD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0c0e;
            color: #d1d1d6;
            font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Menlo", monospace;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top Bar */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #141418;
            border-bottom: 1px solid #27272a;
            -webkit-app-region: drag;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: #ffffff;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #71717a;
            display: inline-block;
        }

        .dot.live {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }

        .dot.live-static {
            background: #10b981;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .stats-badge {
            font-size: 10px;
            background: #27272a;
            color: #a1a1aa;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Quick Action Bar */
        .actions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: #18181b;
            border-bottom: 1px solid #27272a;
            font-size: 10px;
        }

        .stream-link {
            color: #ff0080;
            text-decoration: none;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-copy {
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #f4f4f5;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
        }

        .btn-copy:hover {
            background: #3f3f46;
        }

        /* Message Stream */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            user-select: text;
            -webkit-user-select: text;
        }

        .message {
            line-height: 1.4;
            word-break: break-word;
            font-size: 11px;
        }

        .time {
            color: #71717a;
            font-size: 10px;
            margin-right: 6px;
        }

        .badge-host {
            background: #ff0080;
            color: #000;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 2px;
            font-size: 9px;
            margin-right: 6px;
            text-transform: uppercase;
        }

        .author {
            color: #a1a1aa;
            font-weight: 600;
            margin-right: 6px;
        }

        .text {
            color: #f4f4f5;
        }

        .empty-placeholder {
            margin: auto;
            color: #52525b;
            text-align: center;
            font-style: italic;
        }

        /* Input Area */
        .input-bar {
            padding: 8px 12px;
            background: #141418;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 8px;
        }

        .input-field {
            flex: 1;
            background: #09090b;
            border: 1px solid #27272a;
            color: #ffffff;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 11px;
            border-radius: 4px;
            outline: none;
        }

        .input-field:focus {
            border-color: #ff0080;
        }

        .btn-send {
            background: #ff0080;
            color: #000000;
            border: none;
            padding: 6px 12px;
            font-weight: 700;
            font-family: inherit;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn-send:hover {
            opacity: 0.9;
        }

        .btn-send:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">
            <span id="liveDot" class="dot"></span>
            <span>SISYFUZ // CHAT HUD</span>
        </div>
        <div id="statsBadge" class="stats-badge">VIEWERS: 0</div>
    </div>

    <div class="actions-bar">
        <span id="streamUrlText" class="stream-link">Connecting...</span>
        <button id="btnCopy" class="btn-copy">COPY LINK</button>
    </div>

    <div id="messagesContainer" class="messages">
        <div class="empty-placeholder">Connecting to stream chat hub...</div>
    </div>

    <form id="chatForm" class="input-bar">
        <input
            id="chatInput"
            type="text"
            class="input-field"
            placeholder="Reply as [HOST]... (Enter)"
            maxlength="200"
            autocomplete="off"
        />
        <button id="btnSend" type="submit" class="btn-send">SEND</button>
    </form>

    <script>
        const WS_URL = "ws://127.0.0.1:9988/ws";
        const HTTP_BASE = "http://127.0.0.1:9988";

        let ws = null;
        let isConnected = false;
        let isLive = false;
        let isHUDVisible = false;
        let hasPendingRender = false;
        const messages = [];

        const liveDot = document.getElementById("liveDot");
        const statsBadge = document.getElementById("statsBadge");
        const streamUrlText = document.getElementById("streamUrlText");
        const btnCopy = document.getElementById("btnCopy");
        const messagesContainer = document.getElementById("messagesContainer");
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");

        function updateIndicator() {
            if (!isConnected) {
                liveDot.className = "dot";
                return;
            }
            if (isLive) {
                // Throttle CSS animation to 0 CPU when HUD is hidden in menu bar
                liveDot.className = isHUDVisible ? "dot live" : "dot live-static";
            } else {
                liveDot.className = "dot";
            }
        }

        window.onHUDVisibilityChange = function(visible) {
            isHUDVisible = Boolean(visible);
            updateIndicator();
            if (isHUDVisible && (hasPendingRender || messages.length > 0)) {
                renderMessages();
                hasPendingRender = false;
            }
        };

        function renderMessages() {
            if (messages.length === 0) {
                messagesContainer.innerHTML = '<div class="empty-placeholder">No messages yet. Chat will appear here in real-time.</div>';
                return;
            }

            messagesContainer.innerHTML = messages.map(m => {
                const timeStr = m.time ? new Date(m.time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                const isHost = m.isHost || (m.user && m.user.startsWith('[HOST]'));
                const cleanUser = isHost ? m.user.replace(/^\[HOST\]\s*/, '') : (m.user || 'anon');

                return `
                    <div class="message">
                        <span class="time">${timeStr}</span>
                        ${isHost ? '<span class="badge-host">HOST</span>' : `<span class="author">${escapeHtml(cleanUser)}:</span>`}
                        <span class="text">${escapeHtml(m.text || '')}</span>
                    </div>
                `;
            }).join('');

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function connect() {
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    isConnected = true;
                    updateIndicator();
                    // Authenticate as HOST to receive status push
                    ws.send(JSON.stringify({ type: "host_auth" }));
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === "chat_history") {
                            messages.length = 0;
                            if (Array.isArray(msg.messages)) {
                                messages.push(...msg.messages);
                            }
                            if (isHUDVisible) {
                                renderMessages();
                            } else {
                                hasPendingRender = true;
                            }
                        } else if (msg.type === "chat") {
                            messages.push(msg);
                            if (messages.length > 60) messages.shift();
                            if (isHUDVisible) {
                                renderMessages();
                            } else {
                                hasPendingRender = true;
                            }
                        } else if (msg.type === "stats") {
                            if (typeof msg.viewers === "number") {
                                statsBadge.textContent = `VIEWERS: ${msg.viewers}`;
                            }
                        } else if (msg.type === "status") {
                            isLive = Boolean(msg.active);
                            if (msg.url) {
                                streamUrlText.textContent = msg.url;
                                streamUrlText.href = msg.url;
                            } else {
                                streamUrlText.textContent = "https://sisyfuz.com/live";
                            }
                            if (typeof msg.viewers === "number") {
                                statsBadge.textContent = `VIEWERS: ${msg.viewers}`;
                            }
                            updateIndicator();
                        }
                    } catch (e) {
                        console.error(e);
                    }
                };

                ws.onclose = () => {
                    isConnected = false;
                    updateIndicator();
                    setTimeout(connect, 3000);
                };

                ws.onerror = () => {
                    isConnected = false;
                    updateIndicator();
                };
            } catch (e) {
                setTimeout(connect, 3000);
            }
        }

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "chat",
                    user: "Host",
                    isHost: true,
                    text: text
                }));
                chatInput.value = "";
            } else {
                fetch(`${HTTP_BASE}/chat/send`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user: "Host", isHost: true, text: text })
                }).then(() => {
                    chatInput.value = "";
                }).catch(console.error);
            }
        };

        btnCopy.onclick = () => {
            const url = streamUrlText.textContent || "https://sisyfuz.com/live";
            navigator.clipboard.writeText(url).then(() => {
                btnCopy.textContent = "COPIED!";
                setTimeout(() => { btnCopy.textContent = "COPY LINK"; }, 1500);
            });
        };

        connect();
    </script>
</body>
</html>
