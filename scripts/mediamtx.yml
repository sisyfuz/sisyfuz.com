# scripts/mediamtx.yml
# Ultra-Low Latency Media Engine for sisyfuz.com Live Stream

rtsp: no

# RTMP Ingest from OBS Studio (localhost:1935)
rtmp: yes
rtmpAddress: :1935

# WebRTC Engine (WHIP Ingest & WHEP Sub-Second Playback ~150ms)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins:
  - '*'

# Low-Latency HLS (Aggressive 500ms segments, 100ms parts)
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 500ms
hlsPartDuration: 100ms
hlsAllowOrigins:
  - '*'

# Stream Paths
paths:
  live:
    source: publisher
  all_others:
