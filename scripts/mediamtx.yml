# scripts/mediamtx.yml
# High-Stability Smooth 60 FPS Video Engine for sisyfuz.com

rtsp: no

# RTMP Ingest from OBS Studio (localhost:1935)
rtmp: yes
rtmpAddress: :1935

# WebRTC Ultra-Low Latency Playback (WHEP)
webrtc: yes
webrtcAddress: :8889
webrtcICEServers2:
  # Google public STUN (free, no credentials)
  - url: stun:stun.l.google.com:19302
  # Metered.ca TURN relay (env vars injected at runtime)
  - url: $METERED_TURN_URL
    username: $METERED_TURN_USERNAME
    password: $METERED_TURN_CREDENTIAL

# High-Performance HLS (1s segments for zero buffer starvation)
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentCount: 5
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins:
  - '*'

# Stream Paths
paths:
  live:
    source: publisher
  all_others:
